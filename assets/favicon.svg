<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="M'uzie cassette icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ee"/>
      <stop offset="0.5" stop-color="#ffe3d8"/>
      <stop offset="1" stop-color="#ddd2fa"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f6e8ea"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9856a"/>
      <stop offset="1" stop-color="#8a6049"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="0.7" y="0.7" width="62.6" height="62.6" rx="15.3" fill="none"
        stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.4"/>

  <!-- cassette shell -->
  <rect x="10.5" y="15.5" width="43" height="33" rx="7" fill="url(#shell)"
        stroke="#b98a9a" stroke-width="1.5"/>
  <rect x="10.5" y="15.5" width="43" height="33" rx="7" fill="none"
        stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.8"/>

  <!-- paper label -->
  <rect x="15" y="20" width="34" height="8.5" rx="2.4" fill="#fff3e2"
        stroke="#d8b6ac" stroke-width="0.9"/>
  <path d="M18.5 24.4h13" stroke="#b98a9a" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="43.6" cy="24.4" r="1.5" fill="#d9a86a"/>

  <!-- tape window -->
  <rect x="15.5" y="31.5" width="33" height="12" rx="3.4" fill="#e7d6dd"
        stroke="#c3a3ae" stroke-width="0.9"/>
  <path d="M23.6 37.5h16.8" stroke="url(#tape)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- reels -->
  <circle cx="23.6" cy="37.5" r="4.6" fill="#9b7059" stroke="#7c5543" stroke-width="0.9"/>
  <circle cx="40.4" cy="37.5" r="4.6" fill="#9b7059" stroke="#7c5543" stroke-width="0.9"/>
  <circle cx="23.6" cy="37.5" r="1.9" fill="#fffaf4"/>
  <circle cx="40.4" cy="37.5" r="1.9" fill="#fffaf4"/>
  <circle cx="23.6" cy="37.5" r="0.8" fill="#8a6049"/>
  <circle cx="40.4" cy="37.5" r="0.8" fill="#8a6049"/>

  <!-- foot line -->
  <path d="M25 45.5h14" stroke="#d3b2b8" stroke-width="1.3" stroke-linecap="round"/>
</svg>
